name: TPEx institutional daily update

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Optional YYYY-MM-DD date used only for testing
        required: false
        type: string
        default: ""
  schedule:
    # UTC 10:00 = 台灣時間 18:00
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-monitor-state
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime /tmp/stock-monitor-state
          git fetch origin state || true
          if ! git show-ref --verify --quiet refs/remotes/origin/state; then
            echo "state branch does not exist; publish the local Phase 5H seed first."
            exit 1
          fi
          git archive origin/state | tar -x -C /tmp/stock-monitor-state
          if [ -f /tmp/stock-monitor-state/state.json ]; then
            cp /tmp/stock-monitor-state/state.json runtime/state.json
          fi
          if [ ! -d /tmp/stock-monitor-state/institutional ]; then
            echo "institutional seed is missing from the state branch."
            exit 1
          fi
          cp -R /tmp/stock-monitor-state/institutional runtime/institutional

      - name: Update TPEx institutional model
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.as_of_date }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --as-of-date ${{ inputs.as_of_date }}"
          fi
          python -m src.institutional.daily_pipeline update $EXTRA_ARGS

      - name: Save state branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stock-monitor-payload
          mkdir -p /tmp/stock-monitor-payload
          if [ -f runtime/state.json ]; then
            cp runtime/state.json /tmp/stock-monitor-payload/state.json
          else
            printf '{"records":{},"institutional_notification_keys":{}}\n' > /tmp/stock-monitor-payload/state.json
          fi
          cp -R runtime/institutional /tmp/stock-monitor-payload/institutional

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin state
          git switch -C state origin/state
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/stock-monitor-payload/. .
          git add state.json institutional
          git commit -m "Update TPEx institutional state [skip ci]" || true
          git push origin state
